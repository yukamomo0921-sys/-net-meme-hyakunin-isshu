<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百人一首 落下クイズ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4efe4;color:#352d25;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.game{position:relative;max-width:760px;min-height:650px;margin:30px auto;background:#fffaf0;border:2px solid #d8c8a7;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px #0001}
header{height:64px;padding:18px 24px;border-bottom:1px solid #e1d5bd;background:#fffdf8;display:flex;justify-content:space-between}
.field{position:relative;height:500px;overflow:hidden}
.card{position:absolute;left:50%;top:-130px;transform:translateX(-50%);width:min(88%,600px);padding:22px 28px;text-align:center;background:#fff;border:2px solid #cbb78c;border-radius:14px;box-shadow:0 6px 18px #0002;font-family:serif;font-size:clamp(20px,4vw,32px);line-height:1.7}
.label{font-family:system-ui;font-size:12px;letter-spacing:.15em;color:#967b4e;margin-bottom:6px}
.controls{position:absolute;left:0;right:0;bottom:0;padding:24px;text-align:center;background:linear-gradient(transparent,#fffaf0 28%)}
button{border:0;border-radius:12px;padding:13px 24px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#ad4c4c;color:#fff}.secondary{background:#e9dfca;color:#352d25}
.answer{display:flex;gap:8px;max-width:560px;margin:auto}
input{flex:1;min-width:0;padding:13px;border:2px solid #d5c6a7;border-radius:12px;font-size:17px;outline:none}
input:focus{border-color:#b99350}
.hidden{display:none!important}
.result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fffaf0ee;text-align:center;z-index:5}
.mark{font-size:80px;font-weight:900}.ok{color:#2d8a57}.ng{color:#b64c4c}
.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.hint{font-size:13px;color:#8c806e;margin-top:8px}
</style>
</head>
<body>
<div class="game">
<header><strong>百人一首 落下クイズ</strong><span>第 <b id="num">1</b> 問</span></header>

<div class="field" id="field">
  <div class="card" id="card">
    <div class="label">上の句</div>
    <div id="question"></div>
  </div>

  <div class="controls">
    <button id="answerBtn" class="primary">回答する</button>

    <form id="answerArea" class="answer hidden">
      <input id="answer" autocomplete="off" placeholder="下の句を入力…">
      <button class="primary" type="submit">回答</button>
    </form>
    <div class="hint">答えを入力して判定します</div>
  </div>

  <div id="result" class="result hidden"></div>
</div>
</div>

<script>
/*
  問題データはここを編集してください。
  answer は複数登録できます。
*/
// 正解は「answers のどれか1つが回答に含まれていればOK」。
// 例：answers: ["1700", "センナナヒャク"] なら
// 「答えは1700です」「センナナヒャク！！」なども正解になります。
const questions = [
  {question:'ﾄﾞｩﾜｧ!!', answers:['ｾﾝﾅﾅﾋｬｸ!!','ﾝﾅﾅﾋｬｸ', 'センナナヒャク', 'せんななひゃく', '1700', '１７００']},
  {question:'ぬるぽ', answers:['ガッ', 'ｶﾞｯ','がっ']},
  {question:'君のような勘のいいガキは', answers:['嫌いだよ']},
  {question:'お前はもう', answers:['死んでいる']},
  {question:'あきらめたら', answers:['そこで試合終了ですよ','試合終了']},
  {question:'見ろ！人が', answers:['ゴミのようだ！', 'ゴミのようだ']},
  {question:'おい！', answers:['笑える', 'わらえる']},
  {question:'やらないか？？？？', answers:['あ', 'あ']},
  {question:'働いたら', answers:['負け']},
  {question:'それってあなたの', answers:['感想ですよね','感想','かんそう']},
  {question:'誠に遺憾です', answers:['残念です','ざんねん','残念']},
  {question:'おそろしく速い手刀', answers:['オレじゃなきゃ見落としちゃうね']},
  {question:'ご自身は...?', answers:['バキバキ童貞です']},
  {question:'ケツアナ', answers:['確定！', '確定']},
  {question:'あまり強い言葉を使うなよ', answers:['弱く見えるぞ']},
  {question:'ゲームのカードを', answers:['落としてしまったのですが','おとしてしまった']},
  {question:'次回！！', answers:['城之内死す！！','城之内']},
  {question:'オメェの席', answers:['ねぇから','ねえから']},
  {question:'何を', answers:['四天王！？','四天王']},
  {question:'', answers:['']},
  {question:'タピオカ', answers:['パン！！！','パン','ぱん']},
  {question:'でも幸せなら', answers:['OKです', 'OK','オッケー','おっけー']},
  {question:'パフェ', answers:['いわし','イワシ','鰯']},
  {question:'21歳', answers:['拳で','こぶしで']},
  {question:'そんな装備で', answers:['大丈夫か？']},
  {question:'おけつブンブン', answers:['フェスティバル']},
  {question:'どしたん？話', answers:['聞こか？','ピポパ？','ぴぽぱ？','きこか？']},
  {question:'ゴミを流さないよ（決意）', answers:['うに（注文）','うに']},
  {question:'君たちは寝ないのか？俺は　〜', answers:['寝るが']},
  {question:'無課金', answers:['おじさん']}
];

const card = document.getElementById("card");
const question = document.getElementById("question");
const num = document.getElementById("num");
const answerBtn = document.getElementById("answerBtn");
const answerArea = document.getElementById("answerArea");
const input = document.getElementById("answer");
const result = document.getElementById("result");

let index = 0;
let answered = false;
let fallTimer = null;
let quizQuestions = [];
let correctCount = 0;
let askedCount = 0;
let gameResults = [];
const QUESTIONS_PER_GAME = 10;

function normalize(text) {
  return text.replace(/[\s　。、，,！？!?「」『』・]/g, "").toLowerCase();
}

function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startGame() {
  quizQuestions = shuffle(questions).slice(0, QUESTIONS_PER_GAME);
  index = 0;
  correctCount = 0;
  askedCount = 0;
  gameResults = [];
  answered = false;
  result.classList.add("hidden");
  answerBtn.classList.remove("hidden");
  input.value = "";
  showQuestion();
}

function showQuestion() {
  clearInterval(fallTimer);

  const q = quizQuestions[index];
  question.textContent = q.question;
  num.textContent = `${index + 1} / ${QUESTIONS_PER_GAME}`;

  card.style.top = "-130px";

  let y = -130;
  fallTimer = setInterval(() => {
    y += 3;
    card.style.top = y + "px";
    if (y >= 150) clearInterval(fallTimer);
  }, 16);
}

function startAnswer() {
  if (answered) return;

  answerBtn.classList.add("hidden");
  answerArea.classList.remove("hidden");
  input.focus();
}

function checkAnswer(event) {
  event.preventDefault();

  if (answered) return;

  const userAnswer = normalize(input.value);
  if (!userAnswer) return;

  const q = quizQuestions[index];
  // 登録した正解候補のどれか1つでも回答に含まれていれば正解。
const correct = q.answers.some(a => {
  const keyword = normalize(a);
  return keyword && userAnswer.includes(keyword);
});

  // 最終的に確定した回答だけを成績に記録する。
  // 答え直した場合は、前の回答を上書きする。
  const existingResult = gameResults.find(r => r.question === q.question);
  const finalAnswer = input.value.trim() || "（無回答）";

  if (existingResult) {
    existingResult.userAnswer = finalAnswer;
    existingResult.correct = correct;
  } else {
    gameResults.push({
      question: q.question,
      userAnswer: finalAnswer,
      correctAnswer: q.answers[0],
      correct: correct
    });
  }

  answered = true;
  askedCount++;

  if (correct) {
    correctCount++;
    answerArea.classList.add("hidden");

    result.innerHTML = `
      <div>
        <div class="mark ok">○</div>
        <h2>正解！</h2>
        <p>${q.answers[0]}</p>
        <div class="buttons">
          <button class="primary" id="nextBtn">
            ${index + 1 >= QUESTIONS_PER_GAME ? "結果を見る" : "次の問題"}
          </button>
        </div>
      </div>
    `;
    result.classList.remove("hidden");
    document.getElementById("nextBtn").onclick =
      index + 1 >= QUESTIONS_PER_GAME ? showFinalResult : nextQuestion;

  } else {
    answerArea.classList.add("hidden");

    result.innerHTML = `
      <div>
        <div class="mark ng">×</div>
        <h2>不正解</h2>
        <p>もう一度答えますか？</p>
        <div class="buttons">
          <button class="primary" id="againBtn">もう一度答える</button>
          <button class="secondary" id="dontKnowBtn">わからない</button>
        </div>
      </div>
    `;
    result.classList.remove("hidden");

    document.getElementById("againBtn").onclick = retry;
    document.getElementById("dontKnowBtn").onclick = nextQuestionOrResult;
  }
}

function retry() {
  answered = false;
  input.value = "";
  result.classList.add("hidden");
  answerArea.classList.remove("hidden");
  input.focus();
}

function nextQuestion() {
  index++;
  answered = false;
  input.value = "";
  result.classList.add("hidden");
  answerBtn.classList.remove("hidden");
  showQuestion();
}

function nextQuestionOrResult() {
  // 「わからない」は不正解として確定し、正解を表示してから次へ進む。
  const q = quizQuestions[index];
  const existing = gameResults.find(r => r.question === q.question);
  if (existing) {
    // 最初に入力した回答はそのまま残す。
    existing.correct = false;
  }

  result.innerHTML = `
    <div>
      <div class="mark ng">×</div>
      <h2>正解は…</h2>
      <p style="font-family:serif;font-size:22px;font-weight:700;margin-top:12px">
        ${escapeHtml(q.answers[0])}
      </p>
      <div class="buttons">
        <button class="primary" id="continueBtn">
          ${index + 1 >= QUESTIONS_PER_GAME ? "結果を見る" : "次の問題"}
        </button>
      </div>
    </div>
  `;
  result.classList.remove("hidden");

  document.getElementById("continueBtn").onclick = () => {
    if (index + 1 >= QUESTIONS_PER_GAME) {
      showFinalResult();
    } else {
      nextQuestion();
    }
  };
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function showFinalResult() {
  clearInterval(fallTimer);
  answerArea.classList.add("hidden");
  answerBtn.classList.add("hidden");

  const rate = Math.round((correctCount / QUESTIONS_PER_GAME) * 100);

  let comment = "";
  if (rate === 100) comment = "全問正解！すごい！";
  else if (rate >= 80) comment = "かなり強い！";
  else if (rate >= 60) comment = "いい感じ！もう少し！";
  else if (rate >= 40) comment = "まだまだ伸びしろあり！";
  else comment = "ここから覚えていこう！";

  const rows = gameResults.map((r, i) => {
    const mark = r.correct ? "○" : "×";
    const color = r.correct ? "#2d8a57" : "#b64c4c";
    return `
      <div style="text-align:left;border:1px solid #dfd3bc;border-radius:12px;padding:13px 15px;background:#fff;margin-bottom:9px">
        <div style="font-size:13px;color:#8c806e;margin-bottom:6px">
          ${i + 1}問目　${mark}
        </div>
        <div style="font-family:serif;font-size:16px;line-height:1.5;margin-bottom:8px">
          ${r.question}
        </div>
        <div style="font-size:13px">
          <div><span style="color:#8c806e">あなたの回答：</span>
            <span style="color:${color};font-weight:700">${escapeHtml(r.userAnswer)}</span>
          </div>
          <div><span style="color:#8c806e">正解：</span>
            <span style="font-weight:700">${escapeHtml(r.correctAnswer)}</span>
          </div>
        </div>
      </div>
    `;
  }).join("");

  result.innerHTML = `
    <div style="width:min(92%,650px);max-height:92%;overflow:auto;padding:20px 5px">
      <div style="font-size:45px">🎴</div>
      <h2 style="margin:5px 0">10問終了！</h2>
      <div style="font-size:42px;font-weight:900;margin:8px 0">${rate}%</div>
      <div style="font-size:18px">${correctCount} / ${QUESTIONS_PER_GAME} 問正解</div>
      <p style="margin:10px 0 18px">${comment}</p>

      <div style="text-align:left;font-weight:700;margin-bottom:9px">
        回答結果
      </div>
      ${rows}

      <div class="buttons">
        <button class="primary" id="restartBtn">もう一度挑戦</button>
      </div>
    </div>
  `;

  result.classList.remove("hidden");
  document.getElementById("restartBtn").onclick = startGame;
}

answerBtn.addEventListener("click", startAnswer);
answerArea.addEventListener("submit", checkAnswer);

startGame();
answerBtn.addEventListener("click", startAnswer);
answerArea.addEventListener("submit", checkAnswer);

showQuestion();
</script>
</body>
</html>
